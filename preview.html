<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEAD TOWN - iPhone 14 Pro Landscape Preview</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#141412;color:#e9e3d2;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;overflow:hidden}
  .stage{display:flex;align-items:center;justify-content:center}
  .phone{position:relative;width:876px;height:417px;border-radius:62px;background:#050505;padding:12px;
    box-shadow:0 0 0 2px #3a3a38,0 0 0 6px #1d1d1c,0 30px 80px rgba(0,0,0,.7);transform-origin:center}
  .screen{position:relative;width:852px;height:393px;border-radius:50px;overflow:hidden;background:#000}
  iframe{width:852px;height:393px;border:0;display:block}
  .island{position:absolute;top:50%;left:11px;transform:translateY(-50%);width:37px;height:126px;border-radius:20px;background:#000;pointer-events:none;z-index:2}
  .homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#e9e3d2;opacity:.8;pointer-events:none;z-index:2}
  .side{width:876px;display:grid;grid-template-columns:1.1fr 1fr 1.2fr .9fr;gap:24px;align-items:start}
  .side h1{font-size:28px;font-weight:900;letter-spacing:-.01em}
  .side h1 span{color:#c8141f}
  .side p{font-size:13px;opacity:.7;margin:6px 0 0;line-height:1.5}
  .side h2{font-size:12px;letter-spacing:.1em;color:#ff4b55;margin:4px 0 8px}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13.5px;align-items:center}
  kbd{display:inline-block;min-width:28px;padding:3px 7px;text-align:center;background:#e9e3d2;color:#0b0b0a;font:700 12px/1.3 ui-monospace,monospace;border-radius:3px}
  .btns{display:flex;flex-direction:column;gap:8px}
  .btns button{padding:11px;font:800 14px inherit;font-family:inherit;border:2px solid #e9e3d2;background:none;color:inherit;cursor:pointer}
  .btns button.w{background:#e9e3d2;color:#0b0b0a}
  @media (max-height:640px){.side{display:none}}
</style>
</head>
<body>
  <div class="stage"><div class="phone" id="phone">
    <div class="screen"><iframe id="game" src="index.html?sim=1" title="DEAD TOWN"></iframe></div>
    <div class="island"></div><div class="homebar"></div>
  </div></div>
  <div class="side">
    <div><h1>DEAD<span>TOWN</span></h1>
    <p>아이폰 14 Pro 가로 화면(852×393) 미리보기.<br>다이나믹 아일랜드·홈바 영역 반영.</p>
    <h2>마우스</h2>
    <div class="keys">
      <span>왼쪽 아래 드래그</span><span>이동 (조이스틱)</span>
      <span>버튼 클릭</span><span>공격 · 달리기 · 뒤지기 · 가방</span>
      <span>미니맵 클릭</span><span>전체 지도</span>
    </div></div>
    <div><h2>키보드 (화면 한 번 클릭 후)</h2>
    <div class="keys">
      <kbd>WASD</kbd><span>이동</span>
      <kbd>Shift</kbd><span>달리기</span>
      <kbd>Space</kbd><span>공격</span>
      <kbd>E</kbd><span>가구 뒤지기</span>
      <kbd>I</kbd><span>가방</span>
      <kbd>M</kbd><span>지도</span>
    </div></div>
    <div class="btns">
      <button class="w" onclick="document.getElementById('game').contentWindow.location.reload()">새로고침</button>
      <button onclick="try{localStorage.removeItem('deadtown_save_v1')}catch(e){};document.getElementById('game').contentWindow.location.reload()">저장 기록 삭제</button>
    </div>
  </div>
<script>
  // 창 높이에 맞춰 폰 크기 자동 축소
  function fit(){const side=document.querySelector('.side');const sh=side.offsetParent?side.offsetHeight+26:0;const s=Math.min(1,(innerHeight-40-sh)/417,(innerWidth-40)/876);document.getElementById('phone').style.zoom=s;}
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
