<div id="app">
  <svg id="ground" xmlns="http://www.w3.org/2000/svg"></svg>
  <svg id="view" xmlns="http://www.w3.org/2000/svg"></svg>
  <canvas id="fog"></canvas>
  <svg id="sky" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="tint"></div>
  <canvas id="rain"></canvas>
  <div id="vign"></div>
  <div id="lowhp"></div>
  <div id="cond"><div class="cl cl-heat"></div><div class="cl cl-sick"></div><div class="cl cl-wet"></div><div class="cl cl-frost"></div><div class="cl cl-starve"></div><div class="cl cl-winded"></div><div class="cl cl-bleed"></div><div class="cl cl-crit"></div><div class="cl cl-critv"></div><div class="lid t"></div><div class="lid b"></div></div>
  <div id="hurt"></div>
  <div id="grain"></div>

  <div id="hud">
    <div class="hud-grid">
      <div class="hud-left">
        <div id="clock">
          <div class="daybox"><small>DAY</small><b id="day">1</b></div>
          <div class="timebox">
            <b id="time">09:00</b>
            <div class="trow"><span id="phase"><svg><use id="phaseIcon" href="#i-sun"/></svg><em id="phaseTxt">낮</em></span><span id="tempChip"><svg viewBox="0 0 10 22" class="thermo"><rect x="3" y="1.5" width="4" height="15" rx="2" class="tb"/><rect id="thFill" x="4" y="9" width="2" height="7" fill="currentColor"/><circle cx="5" cy="18" r="3.3" fill="currentColor" stroke="#0b0b0a" stroke-width=".8"/></svg><b id="tempTxt">--°</b></span></div><span id="flTag" class="hidden"></span><span id="carTag" class="hidden"></span>
          </div>
        </div>
        <div id="stats">
          <div class="stat" data-k="hp"><svg><use href="#i-heart"/></svg><b>100</b><span><em></em></span></div>
          <div class="stat" data-k="full"><svg><use href="#i-food"/></svg><b>80</b><span><em></em></span></div>
          <div class="stat" data-k="hyd"><svg><use href="#i-drop"/></svg><b>80</b><span><em></em></span></div>
          <div class="stat" data-k="energy"><svg><use href="#i-moon"/></svg><b>85</b><span><em></em></span></div>
          <div class="stat" data-k="endu"><svg><use href="#i-bolt"/></svg><b>100</b><span><em></em></span></div>
        </div>
        <div id="moodles"></div>
        <div id="mdInfo" class="hidden"></div>
      </div>
      <div class="hud-right">
        <button id="minimap" aria-label="지도"><svg id="mini" viewBox="0 0 28 28"></svg><i class="mm-tag"><svg><use href="#i-map"/></svg></i></button>
        <div class="rcol"><button id="menuBtn" class="icon-btn" aria-label="메뉴"><svg><use href="#i-menu"/></svg></button>
        <button id="zIn" class="icon-btn zb" aria-label="확대">+</button><button id="zOut" class="icon-btn zb" aria-label="축소">−</button></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="act" class="hidden"></div>

  <div id="joyzone"><div id="joy">
    <svg class="jring" viewBox="0 0 100 100"><circle class="rbg" cx="50" cy="50" r="46"/><circle id="joyRing" class="rfg" cx="50" cy="50" r="46"/></svg>
    <i class="zone z1"></i><i class="zone z2"></i>
    <div id="knob"></div><b id="gaitLbl"></b>
  </div></div>

  <button id="btnCrouch" class="btn sm" aria-label="웅크리기"><svg class="ic"><use href="#i-crouch"/></svg><small>웅크리기</small></button>
  <div id="btns">
    <button id="btnAttack" class="btn big">
      <svg class="ring" viewBox="0 0 100 100"><circle class="rbg" cx="50" cy="50" r="46"/><circle id="atkRing" class="rfg" cx="50" cy="50" r="46"/></svg>
      <svg class="ic"><use id="atkIcon" href="#i-fist"/></svg>
      <small id="wname">맨손</small>
    </button>
    <button id="btnUse" class="btn" disabled>
      <svg class="ic"><use href="#i-search"/></svg><small id="useLbl">뒤지기</small>
    </button>
    <button id="btnAlt" class="btn hidden">
      <svg class="ic"><use id="altIcon" href="#i-hand"/></svg><small id="altLbl">행동</small>
    </button>
    <button id="btnSwap" class="btn hidden" aria-label="무기 바꾸기"><svg class="ic"><use id="swapIcon" href="#i-gun"/></svg><i><svg><use href="#i-swap"/></svg></i></button>
    <button id="btnReload" class="btn hidden" aria-label="재장전"><svg class="ic"><use href="#i-reload"/></svg></button>
    <button id="btnBag" class="btn">
      <svg class="ic"><use href="#i-bag"/></svg><small id="bagLbl">0kg</small>
    </button>
  </div>

  <div id="sheet" class="hidden">
    <div class="sheet-card">
      <div class="sheet-head">
        <svg class="hic"><use id="sheetIcon" href="#i-bag"/></svg>
        <b id="sheetTitle">가방</b>
        <div id="sheetTabs"></div>
        <span id="danger" class="hidden"></span>
        <div class="wgauge">
          <svg><use href="#i-weight"/></svg>
          <div class="wbar"><em id="wfill"></em><i class="cap"></i></div>
          <span id="wtext">0 / 15kg</span>
        </div>
        <button id="sheetClose" class="xbtn" aria-label="닫기"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-main">
        <div id="sheetNav"></div>
        <div class="sheet-mid">
          <div id="sheetAct" class="hidden"></div>
          <div id="sheetBody" class="scroll"></div>
        </div>
        <div id="detail" class="hidden"></div>
      </div>
    </div>
  </div>

  <div id="quick"></div>
  <div id="altMenu" class="hidden"></div>

  <div id="bigmap" class="overlay hidden">
    <div class="map-box">
      <div class="map-head"><svg><use href="#i-map"/></svg><b>지도</b><button id="mapClose" class="xbtn" aria-label="닫기"><svg><use href="#i-close"/></svg></button></div>
      <div class="map-wrap"><svg id="bigmapSvg" viewBox="0 0 72 72" preserveAspectRatio="xMidYMid meet"></svg><div id="mapZoom" class="mz"><button data-z="in" aria-label="확대">+</button><button data-z="out" aria-label="축소">−</button><button data-z="me" aria-label="내 위치">◎</button></div></div>
      <div id="mkBar" class="mk-bar">
        <div id="mkNo" class="mk-no hidden"></div>
        <div id="mkTools" class="mk-grid">
          <button data-mk="base" aria-label="기지" title="기지"><svg><use href="#i-mkhome"/></svg></button><button data-mk="car" aria-label="차" title="차"><svg><use href="#i-car"/></svg></button><button data-mk="danger" aria-label="위험" title="위험"><svg><use href="#i-warn"/></svg></button><button data-mk="zomb" aria-label="좀비" title="좀비"><svg><use href="#i-skull"/></svg></button><button data-mk="loot" aria-label="물건" title="물건"><svg><use href="#i-star"/></svg></button>
          <button data-mk="food" aria-label="음식" title="음식"><svg><use href="#i-food"/></svg></button><button data-mk="water" aria-label="물" title="물"><svg><use href="#i-drop"/></svg></button><button data-mk="med" aria-label="약" title="약"><svg><use href="#i-mkmed"/></svg></button><button data-mk="text" aria-label="글자 쓰기" title="글자 쓰기"><svg><use href="#i-mktext"/></svg></button><button data-mk="del" aria-label="지우개" title="지우개"><svg><use href="#i-mkerase"/></svg></button>
        </div>
        <input id="mkText" class="hidden" maxlength="14" placeholder="적을 글자 (14자)" autocomplete="off">
        <div id="mkPens" class="mk-pens"></div>
        <em id="mkHint"></em>
      </div>
      <div class="legend"><span><i class="lg-p"></i>나</span><span id="lgTown">가본 도시만 이름이 보입니다</span><span id="lgRoad">지도 아이템을 읽으면 그 지역이 채워집니다</span></div>
    </div>
  </div>

  <button id="restBar" class="hidden" type="button"><svg class="ic"><use href="#i-bench"/></svg>휴식 중 · 시간 ×3<small>누르거나 움직이면 멈춤</small></button>
  <div id="sleep" class="hidden">
    <svg class="sleep-ic"><use href="#i-moon"/></svg>
    <div class="zzz">Z z z</div>
    <div id="sleepTime">잠자는 중</div>
    <button id="wakeBtn" class="wbtn">일어나기</button>
  </div>

  <div id="menu" class="overlay hidden">
    <div class="ov-box">
      <div class="tape"></div>
      <h2>일시정지</h2>
      <p id="menuStat"></p>
      <button id="mResume" class="wbtn">계속하기</button>
      <button id="mSave" class="obtn">저장하기</button>
      <div class="mrow"><button id="mSound" class="obtn">소리: 켜짐</button><button id="mShake" class="obtn">흔들림·울렁임: 켜짐</button></div>
      <div class="mrow"><button id="mPerf" class="obtn">성능 모드: 꺼짐</button><button id="mHand" class="obtn">조작: 오른손</button><button id="mBtnSz" class="obtn">버튼: 보통</button></div>
      <button id="mJournal" class="obtn">기록 · 읽은 쪽지</button>
      <button id="mNew" class="obtn danger">새 게임</button>
      <p class="mhelp">왼쪽 드래그 이동 · 빨간 버튼 공격(누르고 있으면 연속) · 가구 옆 버튼으로 수색 · 아래 추천 버튼으로 바로 먹기/지혈</p>
    </div>
  </div>

  <div id="story" class="overlay hidden">
    <div class="ov-box story-box">
      <div class="tape"></div>
      <h2 id="storyT"></h2>
      <div id="storyX"></div>
      <div id="storyList"></div>
      <button id="storyClose" class="wbtn">닫기</button>
    </div>
  </div>

  <div id="loading" class="hidden"><div class="ld-box"><i></i><b>마을을 만드는 중…</b></div></div>
  <div id="title" class="overlay">
    <div class="tfog"></div>
    <svg class="tzs" viewBox="0 0 852 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs><g id="zsil"><circle cx="0" cy="-58" r="7"/><path d="M-1 -50Q2 -30 0 -18L-6 0M0 -18L7 0M-1 -46L20 -40M-1 -40L18 -32" fill="none" stroke-width="7" stroke-linecap="round"/></g></defs>
      <g class="zw z1"><use href="#zsil" x="0" y="130"/></g>
      <g class="zw z2"><use href="#zsil" x="0" y="134" transform="scale(1.15)"/></g>
      <g class="zw z3"><use href="#zsil" x="0" y="128"/></g>
      <g class="zw z4"><use href="#zsil" x="0" y="132" transform="scale(.85)"/></g>
      <rect x="0" y="126" width="852" height="14" fill="#0b0b0a"/>
    </svg>
    <div class="ov-box two">
      <div class="col">
        <div class="logo">DEAD<span>TOWN</span></div>
        <div class="tape"></div>
        <p class="tag">마을은 무너졌다. 살아남은 날을 세라.</p>
        <div class="lookpick">
          <svg id="lookSvg" viewBox="0 0 100 100"></svg>
          <div class="lk-rows">
            <div class="lk-row"><button data-k="lkSkin" data-d="-1">◀</button><span id="lkSkin"></span><button data-k="lkSkin" data-d="1">▶</button></div>
            <div class="lk-row"><button data-k="lkHair" data-d="-1">◀</button><span id="lkHair"></span><button data-k="lkHair" data-d="1">▶</button></div>
            <div class="lk-row"><button data-k="lkHc" data-d="-1">◀</button><span id="lkHc"></span><button data-k="lkHc" data-d="1">▶</button></div>
            <div class="lk-row"><button data-k="lkJk" data-d="-1">◀</button><span id="lkJk"></span><button data-k="lkJk" data-d="1">▶</button></div>
            <div class="lk-row"><button data-k="lkPk" data-d="-1">◀</button><span id="lkPk"></span><button data-k="lkPk" data-d="1">▶</button></div>
            <button id="lkRand" class="lk-rand">무작위</button>
          </div>
        </div>
      </div>
      <div class="col">
        <button id="tContinue" class="wbtn hidden">이어하기</button>
        <button id="tNew" class="obtn">새 게임</button>
        <div class="help">
          <span><svg><use href="#i-hand"/></svg>왼쪽 조이스틱: 살짝 걷기 · 중간 달리기 · 끝까지 질주</span>
          <span><svg><use href="#i-run"/></svg>달리기·총소리는 좀비를 부른다</span>
          <span><svg><use href="#i-moon"/></svg>밤에는 시야가 좁고 좀비가 빠르다</span>
        </div>
      </div>
    </div>
  </div>

  <div id="dead" class="overlay hidden">
    <div class="ov-box">
      <svg class="skull"><use href="#i-skull"/></svg>
      <div class="logo red">사망</div>
      <div class="tape"></div>
      <p id="deadStat"></p>
      <button id="dRestart" class="wbtn">다시 시작</button>
    </div>
  </div>
</div>
